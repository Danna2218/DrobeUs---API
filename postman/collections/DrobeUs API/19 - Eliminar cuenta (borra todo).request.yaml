$kind: http-request
url: "{{baseUrl}}/api/auth/cuenta"
method: DELETE
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "contrasena": "tu_contraseña"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 20000
