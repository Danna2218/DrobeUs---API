$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
body:
  type: json
  content: '{ "refreshToken": "{{refreshToken}}" }'
scripts:
  - type: afterResponse
    code: "const r = pm.response.json();\r

      if (r.accessToken) {\r

      \  pm.environment.set(\"refreshAnterior\", pm.environment.get(\"refreshToken\"));\r

      \  pm.environment.set(\"accessToken\", r.accessToken);\r

      \  pm.environment.set(\"refreshToken\", r.refreshToken);\r

      }"
    language: text/javascript
order: 16000
